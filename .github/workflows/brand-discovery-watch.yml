name: Brand catalog discovery watch
on:
  schedule:
    - cron: '19 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-discovery-watch.yml'
      - 'data/official-brand-candidates.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
concurrency:
  group: brand-discovery-watch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/official-routine-catalog.test.mjs scripts/import-oliveyoung-feed.test.mjs scripts/roundlab-catalog-watch.test.mjs scripts/review-official-catalog-formulas.test.mjs
      - name: Load approved official brand directory
        env:
          DIRECTORY_URL: ${{ vars.ROUTINE_BRAND_DIRECTORY_URL }}
        run: |
          if [[ -z "$DIRECTORY_URL" ]]; then exit 0; fi
          directory="$RUNNER_TEMP/official-brand-directory.json"
          if curl --fail --silent --show-error --proto '=https' --max-time 20 --max-filesize 200000 --output "$directory" -- "$DIRECTORY_URL"; then
            echo "ROUTINE_BRAND_DIRECTORY=$directory" >> "$GITHUB_ENV"
          else
            echo "::warning::Approved brand directory unavailable; checking bundled candidates"
          fi
      - name: Update official brand listing snapshot
        run: |
          ROUTINE_CATALOG_OUTPUT=official-brand-discovery.json node scripts/sync-official-routine-catalog.mjs "${RUNNER_TEMP}/dearsince-brand-pages" --fetch --scheduled
          node scripts/build-catalog-review-queue.mjs official-brand-discovery.json catalog-review-queue.json
      - name: Import approved Olive Young listings
        continue-on-error: true
        env:
          OLIVEYOUNG_APPROVED_FEED_URL: ${{ secrets.OLIVEYOUNG_APPROVED_FEED_URL }}
        run: node scripts/import-oliveyoung-feed.mjs data/oliveyoung-discovery-seed.json oliveyoung-discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-brand-discovery
          path: |
            official-brand-discovery.json
            catalog-review-queue.json
            oliveyoung-discovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Update product search when listings change
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            git switch --detach FETCH_HEAD
            node scripts/publish-brand-search-snapshot.mjs official-brand-discovery.json
            if git diff --quiet -- src/data/routineLookupExpansion.json; then exit 0; fi
            git add src/data/routineLookupExpansion.json
            git commit -m "Refresh verified-source search listings"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 2; fi
          done
          exit 1
      - name: Review official formulas and ingredient signals
        run: |
          previous=$(gh run list --workflow brand-discovery-watch.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          report=()
          if [[ -n "$previous" ]] && gh run download "$previous" --name official-formula-review --dir prior-review 2>/dev/null; then
            report=(prior-review/official-formula-review.json)
          fi
          node scripts/review-official-catalog-formulas.mjs official-brand-discovery.json official-formula-review.json "${report[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: official-formula-review
          path: official-formula-review.json
          if-no-files-found: error
          retention-days: 90
